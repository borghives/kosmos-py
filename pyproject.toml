[project]
name = "kosmos"
version = "1.6.0"
description = "A Python library for data analysis and persistence."
authors = [{ name = "Ed Dao", email = "ed@intellogic.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow>=1.4.0",
    "google-cloud-resource-manager>=1.17.0",
    "google-cloud-secret-manager>=2.28.0",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "pyarrow>=22.0.0",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "pymongoarrow>=1.11.1",
    "pyrefly>=1.0.0",
    "pyrsistent>=0.20.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

repository = "https://github.com/borghives/kosmos-py"
homepage = "https://github.com/borghives/kosmos-py"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.urls]
Homepage = "https://github.com/borghives/kosmos-py"
Repository = "https://github.com/borghives/kosmos-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "faker>=40.19.1",
    "pandas-stubs>=3.0.3.260530",
    "py-spy>=0.4.2",
    "pyarrow-stubs>=20.0.0.20251215",
    "pytest>=9.0.3",
]
